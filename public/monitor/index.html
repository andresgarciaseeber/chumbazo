<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chumbazo Monitor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0d0d0d;
      --surface-2:  #242424;
      --border:     #2e2e2e;
      --accent:     #f97316;
      --text:       #f0f0f0;
      --text-muted: #888;
      --system:     #4ade80;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #messages {
      height: 100vh;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg         { font-size: .875rem; line-height: 1.45; word-break: break-word; }
    .msg .nick   { font-weight: 700; color: var(--accent); margin-right: 5px; }
    .msg .body   { color: var(--text); }
    .msg .time   { color: var(--text-muted); font-size: .7rem; margin-left: 6px; }
  </style>
</head>
<body>

<div id="messages"></div>

<script>
(function () {
  const messages = document.getElementById('messages');
  let lastTs = 0;

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function scrollBottom() { messages.scrollTop = messages.scrollHeight; }

  function trimMessages() {
    while (messages.children.length > 80) messages.removeChild(messages.firstChild);
  }

  function renderMsg(m) {
    if (m.type === 'system') return;
    const el = document.createElement('div');
    {
      el.className = 'msg';
      const time = new Date(m.ts).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
      el.innerHTML =
        `<span class="nick">${esc(m.nickname)}</span>` +
        `<span class="body">${esc(m.text)}</span>` +
        `<span class="time">${time}</span>`;
    }
    messages.appendChild(el);
    trimMessages();
  }

  fetch('/api/messages')
    .then(r => r.json())
    .then(msgs => {
      msgs.forEach(renderMsg);
      if (msgs.length) lastTs = msgs[msgs.length - 1].ts;
      scrollBottom();
      setInterval(fetchNew, 1500);
    });

  function fetchNew() {
    fetch(`/api/messages?since=${lastTs}`)
      .then(r => r.json())
      .then(msgs => {
        if (!msgs.length) return;
        msgs.forEach(renderMsg);
        lastTs = msgs[msgs.length - 1].ts;
        scrollBottom();
      })
      .catch(() => {});
  }
})();
</script>
</body>
</html>
