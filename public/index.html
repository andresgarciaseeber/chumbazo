<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chumbazo Live ⚽</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

<!-- MODAL APODO -->
<div id="nickname-overlay">
  <div class="modal-box">
    <div class="logo">⚽ Chumbazo</div>
    <div class="subtitle">Sala de transmisión — Mundial 2026</div>
    <label for="nickname-input">Tu apodo en el chat</label>
    <input
      id="nickname-input"
      type="text"
      placeholder="Ej: GoleadorArgento"
      maxlength="24"
      autocomplete="off"
    />
    <button id="join-btn">Entrar al stream</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="brand">⚽ Chumbazo Live</div>
    <div class="live-badge">EN VIVO</div>
    <div class="viewers">
      👁 <span id="viewer-count">—</span> <span class="viewers-label">espectadores</span>
    </div>

    <nav class="header-nav" id="header-nav">
      <a class="lpf-link" href="https://lpf.vod.immergo.tv/" target="_blank" rel="noopener">
        <img src="https://lpf.vod.immergo.tv/lpf-immergo/uploaded/c0146dd1-dd1c-46b8-83e6-4ecb8fa8ca02.png" alt="LPF Play" />
        <span>Sinc partido</span>
      </a>
      <a class="ig-link" href="https://www.instagram.com/chumbazotv/" target="_blank" rel="noopener">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 1.366.062 2.633.334 3.608 1.308.975.975 1.246 2.242 1.308 3.608.058 1.266.07 1.646.07 4.851s-.012 3.584-.07 4.85c-.062 1.366-.334 2.633-1.308 3.608-.975.975-2.242 1.246-3.608 1.308-1.266.058-1.646.07-4.85.07s-3.584-.012-4.85-.07c-1.366-.062-2.633-.334-3.608-1.308-.975-.975-1.246-2.242-1.308-3.608C2.175 15.584 2.163 15.204 2.163 12s.012-3.584.07-4.85c.062-1.366.334-2.633 1.308-3.608.975-.975 2.242-1.246 3.608-1.308C8.416 2.175 8.796 2.163 12 2.163zm0-2.163C8.741 0 8.332.014 7.052.072 5.197.157 3.355.673 2.014 2.014.673 3.355.157 5.197.072 7.052.014 8.332 0 8.741 0 12c0 3.259.014 3.668.072 4.948.085 1.855.601 3.697 1.942 5.038 1.341 1.341 3.183 1.857 5.038 1.942C8.332 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 1.855-.085 3.697-.601 5.038-1.942 1.341-1.341 1.857-3.183 1.942-5.038C23.986 15.668 24 15.259 24 12c0-3.259-.014-3.668-.072-4.948-.085-1.855-.601-3.697-1.942-5.038C20.645.673 18.803.157 16.948.072 15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zm0 10.162a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
        <span>Seguinos</span>
      </a>
      <button class="notify-btn" id="notify-btn">🔔 <span>Avisame</span></button>
    </nav>

    <button class="hamburger" id="hamburger" aria-label="Menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div id="score-bar" class="score-bar hidden">
    <span class="sb-label" id="sb-label">⚽</span>
    <div id="sb-matches"></div>
  </div>

  <div class="main-area">
    <!-- PLAYER -->
    <div class="player-panel">
      <iframe
        id="stream-frame"
        src=""
        allowfullscreen
        allow="autoplay; fullscreen"
        title="Stream en vivo"
      ></iframe>
    </div>

    <!-- CHAT -->
    <div class="chat-panel">
      <div class="chat-header">Chat en vivo</div>
      <div id="messages"></div>

      <div class="emoji-bar">
        <button class="emoji-btn" data-emoji="⚽">⚽</button>
        <button class="emoji-btn" data-emoji="🥅">🥅</button>
        <button class="emoji-btn" data-emoji="🚩">🚩</button>
        <button class="emoji-btn" data-emoji="🔥">🔥</button>
        <button class="emoji-btn" data-emoji="😱">😱</button>
        <button class="emoji-btn" data-emoji="🎉">🎉</button>
      </div>

      <div class="chat-input-area">
        <input
          id="msg-input"
          type="text"
          placeholder="Escribí algo..."
          maxlength="300"
          autocomplete="off"
          disabled
        />
        <button id="send-btn" disabled>➤</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL SUSCRIPCIÓN -->
<div id="sub-overlay" class="hidden">
  <div class="sub-box">
    <button class="sub-close" id="sub-close" aria-label="Cerrar">✕</button>
    <div class="sub-icon">🔔</div>
    <h2>Avisame cuando estén en vivo</h2>
    <p>Dejá tu correo y te avisamos cada vez que Chumbazo transmita en vivo.</p>
    <input id="sub-email" type="email" placeholder="tu@correo.com" autocomplete="email" />
    <button id="sub-submit">Quiero que me avisen</button>
    <div id="sub-status" class="sub-status"></div>
  </div>
</div>

<script src="/js/chat.js"></script>
</body>
</html>
