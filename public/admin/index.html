<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chumbazo Admin ⚽</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .admin-box {
      width: 100%;
      max-width: 460px;
      background: #161616;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
    }
    .admin-box .logo {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .admin-box .subtitle {
      color: var(--text-muted);
      font-size: .85rem;
      margin-bottom: 22px;
    }
    .admin-box label {
      display: block;
      font-size: .8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      margin-top: 16px;
    }
    .admin-box input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: .95rem;
      box-sizing: border-box;
    }
    .admin-box input:focus { outline: none; border-color: var(--accent); }
    .admin-box button {
      width: 100%;
      margin-top: 20px;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #1a0d00;
      font-weight: 700;
      font-size: .95rem;
      cursor: pointer;
    }
    .admin-box button:hover { background: var(--accent-dim); }
    .admin-box button:disabled { opacity: .6; cursor: default; }
    .current-url {
      margin-top: 6px;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: .8rem;
      word-break: break-all;
      min-height: 1.2em;
    }
    .status {
      margin-top: 14px;
      font-size: .85rem;
      min-height: 1.2em;
    }
    .status.ok   { color: #4ade80; }
    .status.err  { color: #f87171; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="admin-box" id="login-box">
    <div class="logo">⚽ Chumbazo Admin</div>
    <div class="subtitle">Acceso restringido</div>
    <label for="secret-input">Clave de administrador</label>
    <input id="secret-input" type="password" placeholder="••••••••••••" autocomplete="off" />
    <button id="login-btn">Ingresar</button>
    <div class="status err hidden" id="login-status"></div>
  </div>

  <!-- PANEL -->
  <div class="admin-box hidden" id="panel-box">
    <div class="logo">⚽ Chumbazo Admin</div>
    <div class="subtitle">Cambiar la URL de la transmisión sin redeploy</div>

    <label>URL actual</label>
    <div class="current-url" id="current-url">cargando…</div>

    <label for="url-input">Nueva URL de streaming</label>
    <input id="url-input" type="text" placeholder="https://..." autocomplete="off" />
    <button id="save-btn">Guardar</button>
    <div class="status hidden" id="save-status"></div>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
